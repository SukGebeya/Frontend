<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verify phone · desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./gebeya.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Ethiopic:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column">
  <dc-import name="VerifyPhone" state="{{state}}" theme="{{theme}}" hint-size="100%,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"state":{"editor":"enum","options":["not sent","sent","wrong code","expired"],"default":"wrong code"},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', state: this.props.state ?? 'wrong code' };
  }
}
</script>
</body>
</html>
