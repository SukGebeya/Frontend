<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./gebeya.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Ethiopic:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="g page {{theme}}" lang="en">
  <div class="slot"><dc-import name="Header" user="guest" cart="1" theme="{{theme}}" hint-size="100%,61px"></dc-import></div>

  <main class="main">
    <div class="wrap">
      <div class="narrow" style="display: flex; flex-direction: column; gap: 28px; padding-top: 24px">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px">
          <span class="logo-m lg" aria-hidden="true">ገ</span>
          <h1 class="t1">Log in</h1>
          <p class="body muted">Welcome back.</p>
        </div>

        <sc-if value="{{resetDone}}" hint-placeholder-val="{{false}}">
          <div class="alert alert-success" role="status">
            <svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12.2 2.3 2.3 4.7-4.8"></path></svg>
            <div class="alert-b"><strong>Password changed</strong><span>Log in with your new password.</span></div>
          </div>
        </sc-if>
        <sc-if value="{{error}}" hint-placeholder-val="{{false}}">
          <div class="alert alert-error" role="alert">
            <svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m9 9 6 6M15 9l-6 6"></path></svg>
            <div class="alert-b"><strong>That didn’t work</strong><span>The phone, email or password isn’t right. Check them and try again.</span></div>
          </div>
        </sc-if>

        <form class="form" method="post" action="#login">
          <input type="hidden" name="next" value="/checkout">
          <div class="field">
            <label class="label" for="l-id">Phone number or email</label>
            <input class="input" id="l-id" name="identifier" type="text" autocomplete="username" value="0911 234 567" required="required">
          </div>
          <div class="field">
            <label class="label" for="l-pw">Password</label>
            <input class="input" id="l-pw" name="password" type="password" autocomplete="current-password" value="••••••••••" required="required">
            <a class="btn btn-link btn-sm" href="ResetRequest.dc.html" style="align-self: flex-end; padding: 0">Forgot your password?</a>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Log in</button>
        </form>

        <p class="sub muted" style="text-align: center">New to Gebeya? <a href="Signup.dc.html" style="font-weight: 600">Create account</a></p>
      </div>
    </div>
  </main>

  <div class="slot"><dc-import name="Footer" signed-in="false" theme="{{theme}}" hint-size="100%,100px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"notice":{"editor":"enum","options":["none","password reset","wrong details"],"default":"none"},"$preview":{"width":360,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const n = this.props.notice ?? 'none';
    return { theme: this.props.theme ?? 'light', error: n === 'wrong details', resetDone: n === 'password reset' };
  }
}
</script>
</body>
</html>
