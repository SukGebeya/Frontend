<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Products</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./gebeya.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Ethiopic:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="g page {{theme}}" lang="en">
  <div class="slot"><dc-import name="Header" user="seller" cart="0" active="shop" theme="{{theme}}" hint-size="100%,61px"></dc-import></div>

  <main class="main">
    <div class="wrap shell">
      <div class="slot"><dc-import name="SellerNav" active="products" theme="{{theme}}" hint-size="100%,124px"></dc-import></div>

      <div style="display: flex; flex-direction: column; gap: 24px; min-width: 0">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <h1 class="t1">Products</h1>
          <a class="btn btn-primary btn-sm" href="SellerNewProduct.dc.html"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New product</a>
        </div>

        <sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
          <div class="list">
            <sc-for list="{{products}}" as="p" hint-placeholder-count="6">
              <a class="lrow" href="SellerProductEditor.dc.html">
                <span class="thumb-s"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><circle cx="9" cy="10" r="1.75"></circle><path d="m21 16-5-5-9 9"></path></svg></span>
                <div class="lrow-main">
                  <span class="lrow-t">{{p.name}}</span>
                  <span class="lrow-s num">{{p.price}}</span>
                  <span class="{{p.stockCls}}">{{p.stock}}</span>
                </div>
                <div class="lrow-end"><span class="{{p.cls}}">{{p.status}}</span></div>
                <svg class="i chev" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
              </a>
            </sc-for>
          </div>
          <nav class="pager" aria-label="Pages">
            <span class="btn btn-secondary btn-sm" aria-disabled="true"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>Previous</span>
            <span class="pager-l">Page 1 of 2</span>
            <a class="btn btn-secondary btn-sm" href="#page-2">Next<svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
          </nav>
        </sc-if>

        <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
          <div class="empty">
            <span class="empty-i"><svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5 12 4l8 3.5v9L12 20l-8-3.5v-9Z"></path><path d="M4 7.5 12 11l8-3.5M12 11v9"></path></svg></span>
            <h2 class="t3">No products yet</h2>
            <p class="sub muted">Add your first product and get a link to share.</p>
            <a class="btn btn-primary btn-sm" href="SellerNewProduct.dc.html">+ New product</a>
          </div>
        </sc-if>
      </div>
    </div>
  </main>

  <div class="slot"><dc-import name="Footer" theme="{{theme}}" hint-size="100%,140px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"empty":{"editor":"boolean","default":false},"$preview":{"width":360,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const empty = this.props.empty === true || this.props.empty === 'true';
    const rows = [
      { name: 'Habesha Kemis', price: 'From 2,500.00 ETB · 3 options', stock: 'Updated 22 Oct 2026, 09:14', status: 'Active' },
      { name: 'Netela Scarf', price: 'From 850.00 ETB · 2 options', stock: 'Updated 21 Oct 2026, 18:40', status: 'Active' },
      { name: 'Jebena Coffee Pot', price: '1,200.00 ETB', stock: 'Updated 20 Oct 2026, 11:02', status: 'Active' },
      { name: 'Kuta Shawl', price: '1,100.00 ETB', stock: 'Updated 18 Oct 2026, 15:27', status: 'Active' },
      { name: 'Gabi Blanket', price: '1,800.00 ETB', stock: 'Updated 15 Oct 2026, 08:51', status: 'Draft' },
      { name: 'Mesob Basket', price: '1,300.00 ETB', stock: 'Updated 2 Oct 2026, 19:33', status: 'Archived' }
    ];
    return {
      theme: this.props.theme ?? 'light',
      empty: empty,
      hasItems: !empty,
      products: rows.map((r) => ({
        name: r.name,
        price: r.price,
        stock: r.stock,
        status: r.status,
        cls: 'badge' + (r.status === 'Active' ? ' b-success' : ''),
        stockCls: 'lrow-s' + (r.low ? ' strong' : ''),
      }))
    };
  }
}
</script>
</body>
</html>
