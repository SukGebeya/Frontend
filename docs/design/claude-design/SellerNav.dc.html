<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seller navigation</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./gebeya.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Ethiopic:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav class="g nc snav {{theme}}" lang="{{lang}}" aria-label="{{t.label}}">
  <div class="snav-shop">
    <div class="snav-name">
      <span style="font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em">Tibeb Shop</span>
      <sc-if value="{{verified}}" hint-placeholder-val="{{true}}">
        <span class="verified">
          <svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12.2 2.3 2.3 4.7-4.8"></path></svg>
          {{t.verified}}
        </span>
      </sc-if>
      <sc-if value="{{notVerified}}" hint-placeholder-val="{{false}}">
        <span class="foot faint">{{t.notVerified}}</span>
      </sc-if>
    </div>
    <a class="btn btn-secondary btn-sm" href="BuyerShop.dc.html">
      {{t.view}}
      <svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16 16 8M9.5 8H16v6.5"></path></svg>
    </a>
  </div>
  <div class="snav-tabs">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
      <a class="stab {{tab.on}}" href="{{tab.href}}" aria-current="{{tab.current}}">
        <svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="{{tab.d}}"></path></svg>
        <span>{{tab.label}}</span>
      </a>
    </sc-for>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"lang":{"editor":"enum","options":["en","am"],"default":"en"},"active":{"editor":"enum","options":["overview","products","orders","wallet","settings"],"default":"overview"},"verified":{"editor":"boolean","default":true},"$preview":{"width":360,"height":128}}'>
class Component extends DCLogic {
  renderVals() {
    const am = (this.props.lang ?? 'en') === 'am';
    const active = this.props.active ?? 'overview';
    const v = this.props.verified;
    const verified = v === undefined ? true : (v === true || v === 'true');
    const t = am
      ? { label: 'የሻጭ ማውጫ', verified: 'የተረጋገጠ ሱቅ', notVerified: 'ገና አልተረጋገጠም', view: 'ሱቁን ይመልከቱ', tabs: ['አጠቃላይ', 'ምርቶች', 'ትዕዛዞች', 'ቦርሳ', 'ቅንብሮች'] }
      : { label: 'Seller', verified: 'Verified shop', notVerified: 'Not verified yet', view: 'View shop', tabs: ['Overview', 'Products', 'Orders', 'Wallet', 'Settings'] };
    const defs = [
      { id: 'overview', href: 'SellerOverview.dc.html', d: 'M4.5 4.5h6v6h-6zM13.5 4.5h6v6h-6zM4.5 13.5h6v6h-6zM13.5 13.5h6v6h-6z' },
      { id: 'products', href: 'SellerProducts.dc.html', d: 'M4 7.5 12 4l8 3.5v9L12 20l-8-3.5v-9ZM4 7.5 12 11l8-3.5M12 11v9' },
      { id: 'orders', href: 'SellerOrders.dc.html', d: 'M6 3h12v18l-3-2-3 2-3-2-3 2V3ZM9 8h6M9 12h6M9 16h3' },
      { id: 'wallet', href: 'SellerWallet.dc.html', d: 'M5 6h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2ZM3 10.5h18M15.5 15h2.5' },
      { id: 'settings', href: 'SellerSettings.dc.html', d: 'M4 7h9M17 7h3M15 5v4M4 17h3M11 17h9M9 15v4' }
    ];
    return {
      theme: this.props.theme ?? 'light',
      lang: am ? 'am' : 'en',
      t: t,
      verified: verified,
      notVerified: !verified,
      tabs: defs.map((d, i) => ({
        href: d.href,
        d: d.d,
        label: t.tabs[i],
        on: d.id === active ? 'is-on' : '',
        current: d.id === active ? 'page' : undefined
      }))
    };
  }
}
</script>
</body>
</html>
