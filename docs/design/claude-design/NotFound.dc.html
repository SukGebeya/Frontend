<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page not found</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./gebeya.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Ethiopic:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="g page {{theme}}" lang="en">
  <div class="slot"><dc-import name="Header" user="guest" cart="0" theme="{{theme}}" hint-size="100%,61px"></dc-import></div>

  <main class="main" style="display: flex; align-items: center">
    <div class="wrap">
      <div class="narrow result" style="padding: 40px 0; gap: 16px">
        <sc-if value="{{notFound}}" hint-placeholder-val="{{true}}">
          <p class="num" style="font-size: 64px; line-height: 68px; font-weight: 700; letter-spacing: -0.04em; color: var(--ink-3)">404</p>
          <h1 class="t1">Page not found</h1>
          <p class="body muted pretty">The link may be mistyped, or the page was removed. If a seller sent it, ask them for a new one.</p>
        </sc-if>
        <sc-if value="{{failed}}" hint-placeholder-val="{{false}}">
          <span class="result-i bad"><svg class="i" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 2.8 19.5h18.4L12 4Z"></path><path d="M12 10v4M12 16.8v.2"></path></svg></span>
          <h1 class="t1">Something went wrong</h1>
          <p class="body muted pretty">We couldn’t load this page. Your money and orders are safe. Try again in a moment.</p>
        </sc-if>
        <a class="btn btn-primary" href="Home.dc.html" style="margin-top: 8px">Go home</a>
      </div>
    </div>
  </main>

  <div class="slot"><dc-import name="Footer" signed-in="false" theme="{{theme}}" hint-size="100%,100px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"kind":{"editor":"enum","options":["not found","error"],"default":"not found"},"$preview":{"width":360,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'not found';
    return { theme: this.props.theme ?? 'light', notFound: k !== 'error', failed: k === 'error' };
  }
}
</script>
</body>
</html>
