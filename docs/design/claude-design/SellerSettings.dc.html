<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop settings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./gebeya.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Ethiopic:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="g page {{theme}}" lang="en">
  <div class="slot"><dc-import name="Header" user="seller" cart="0" active="shop" theme="{{theme}}" hint-size="100%,61px"></dc-import></div>

  <main class="main">
    <div class="wrap shell">
      <div class="slot"><dc-import name="SellerNav" active="settings" theme="{{theme}}" hint-size="100%,124px"></dc-import></div>

      <div style="display: flex; flex-direction: column; gap: 24px; min-width: 0">
        <h1 class="t1">Settings</h1>

        <sc-if value="{{saved}}" hint-placeholder-val="{{true}}">
          <div class="alert alert-success" role="status">
            <svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12.2 2.3 2.3 4.7-4.8"></path></svg>
            <div class="alert-b"><strong>Shop settings saved.</strong></div>
          </div>
        </sc-if>

        <form method="post" action="#settings" class="split half" style="gap: 16px">
          <section class="card" aria-labelledby="shop-h" style="gap: 18px">
            <h2 class="card-t" id="shop-h">Shop</h2>
            <div class="field"><label class="label" for="st-name">Shop name</label><input class="input" id="st-name" name="name" type="text" value="Tibeb Shop"></div>
            <div class="field"><label class="label" for="st-about">About your shop <span class="opt">(optional)</span></label><textarea class="input" id="st-about" name="description" maxlength="500">Handmade habesha clothing and coffee ware, packed and delivered from Addis Ababa.</textarea></div>
            <div class="field"><label class="label" for="st-phone">Shop phone</label><input class="input num" id="st-phone" name="phone" type="tel" inputmode="tel" value="0912 345 678"></div>
            <div class="field">
              <label class="label" for="st-city">City</label>
              <span class="select"><select class="input" id="st-city" name="city"><option>Addis Ababa</option></select><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
            </div>
          </section>

          <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0">
            <section class="card" aria-labelledby="del-h" style="gap: 18px">
              <div style="display: flex; flex-direction: column; gap: 4px">
                <h2 class="card-t" id="del-h">Delivery</h2>
                <p class="foot muted">Buyers see this before they pay. Applies to new orders.</p>
              </div>
              <div class="field">
                <label class="label" for="st-fee">Delivery fee</label>
                <div class="affix"><input class="input num" id="st-fee" name="delivery_fee" type="text" inputmode="decimal" value="150.00"><span class="affix-end">ETB</span></div>
              </div>
              <div class="field">
                <label class="label" for="st-free">Free delivery over <span class="opt">(optional)</span></label>
                <div class="affix"><input class="input num" id="st-free" name="free_over" type="text" inputmode="decimal" value="3,000.00" aria-describedby="st-free-h"><span class="affix-end">ETB</span></div>
                <p class="hint" id="st-free-h">Leave empty to remove free delivery.</p>
              </div>
            </section>

            <button class="btn btn-primary btn-block" type="submit">Save</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div class="slot"><dc-import name="Footer" theme="{{theme}}" hint-size="100%,140px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"saved":{"editor":"boolean","default":true},"$preview":{"width":360,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.saved;
    return {
      theme: this.props.theme ?? 'light',
      saved: s === undefined ? true : (s === true || s === 'true')
    };
  }
}
</script>
</body>
</html>
