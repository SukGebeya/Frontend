<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Footer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./gebeya.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Ethiopic:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<footer class="g ftr {{theme}}" lang="{{lang}}">
  <div class="wrap">
    <div class="ftr-in">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 44px">
        <span class="logo-m sm" aria-hidden="true">ገ</span>
        <span class="foot muted">{{tagline}}</span>
      </div>
      <sc-if value="{{signedIn}}" hint-placeholder-val="{{true}}">
        <form method="post" action="/logout" style="margin: 0">
          <button class="btn btn-secondary btn-sm" type="submit">
            <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"></path></svg>
            {{logout}}
          </button>
        </form>
      </sc-if>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"lang":{"editor":"enum","options":["en","am"],"default":"en"},"signedIn":{"editor":"boolean","default":true},"$preview":{"width":360,"height":150}}'>
class Component extends DCLogic {
  renderVals() {
    const am = (this.props.lang ?? 'en') === 'am';
    const s = this.props.signedIn;
    return {
      theme: this.props.theme ?? 'light',
      lang: am ? 'am' : 'en',
      signedIn: s === undefined ? true : (s === true || s === 'true'),
      tagline: am ? 'ለማኅበራዊ ሚዲያ ሻጮች አስተማማኝ ክፍያ' : 'Safe payments for social sellers',
      logout: am ? 'ውጣ' : 'Log out'
    };
  }
}
</script>
</body>
</html>
