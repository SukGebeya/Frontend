<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home · desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./gebeya.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Ethiopic:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column">
  <dc-import name="Home" theme="{{theme}}" user="{{user}}" hint-size="100%,1400px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"user":{"editor":"enum","options":["guest","buyer","seller"],"default":"guest"},"$preview":{"width":1280,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', user: this.props.user ?? 'guest' };
  }
}
</script>
</body>
</html>
