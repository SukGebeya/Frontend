<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My orders</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./gebeya.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Ethiopic:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="g page {{theme}}" lang="en">
  <div class="slot"><dc-import name="Header" user="buyer" cart="0" active="orders" theme="{{theme}}" hint-size="100%,61px"></dc-import></div>

  <main class="main">
    <div class="wrap" style="display: flex; flex-direction: column; gap: 24px; max-width: 860px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 class="t1">My orders</h1>
        <sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}"><p class="sub muted">Newest first</p></sc-if>
      </div>

      <sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
        <div class="list">
          <sc-for list="{{orders}}" as="o" hint-placeholder-count="5">
            <a class="lrow" href="{{o.href}}">
              <div class="lrow-main">
                <span class="lrow-t">{{o.shop}}</span>
                <span class="lrow-s">{{o.items}}</span>
                <span class="lrow-s num">#{{o.id}} · {{o.date}}</span>
              </div>
              <div class="lrow-end">
                <span class="lrow-amt">{{o.total}}</span>
                <span class="{{o.cls}}">{{o.status}}</span>
              </div>
              <svg class="i chev" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
            </a>
          </sc-for>
        </div>
        <nav class="pager" aria-label="Pages">
          <span class="btn btn-secondary btn-sm" aria-disabled="true"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>Previous</span>
          <span class="pager-l">Page 1 of 3</span>
          <a class="btn btn-secondary btn-sm" href="#page-2">Next<svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
        </nav>
      </sc-if>

      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
        <div class="empty">
          <span class="empty-i"><svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"></path><path d="M9 8h6M9 12h6"></path></svg></span>
          <h2 class="t3">You have no orders yet.</h2>
          <p class="sub muted">When you buy from a seller’s link, the order shows up here.</p>
          <a class="btn btn-secondary btn-sm" href="Home.dc.html">Go home</a>
        </div>
      </sc-if>
    </div>
  </main>

  <div class="slot"><dc-import name="Footer" theme="{{theme}}" hint-size="100%,140px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"empty":{"editor":"boolean","default":false},"$preview":{"width":360,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const empty = this.props.empty === true || this.props.empty === 'true';
    const tone = { Shipped: ' b-info', Delivered: ' b-success', Refunded: '', Cancelled: '', 'In dispute': ' b-warning' };
    const rows = [
      { id: '3eb05c7c', shop: 'Tibeb Shop', items: 'Habesha Kemis · M × 1', date: '22 Oct 2026', total: '2,650.00 ETB', status: 'Shipped', href: 'BuyerOrder.dc.html' },
      { id: 'a2f6c091', shop: 'Meskerem Home', items: 'Mesob Basket × 1', date: '18 Oct 2026', total: '1,450.00 ETB', status: 'Delivered', href: 'BuyerOrderDelivered.dc.html' },
      { id: '7d3e2b10', shop: 'Tibeb Shop', items: 'Netela Scarf × 2', date: '9 Oct 2026', total: '1,850.00 ETB', status: 'Delivered', href: 'BuyerOrderDelivered.dc.html' },
      { id: 'c4e19a77', shop: 'Addis Leather', items: 'Leather Sandals · 41 × 1', date: '2 Oct 2026', total: '1,980.00 ETB', status: 'Refunded', href: 'BuyerOrder.dc.html' },
      { id: '91bd0f3e', shop: 'Meskerem Home', items: 'Jebena Coffee Pot × 1', date: '28 Sep 2026', total: '1,350.00 ETB', status: 'Cancelled', href: 'BuyerOrder.dc.html' }
    ];
    return {
      theme: this.props.theme ?? 'light',
      empty: empty,
      hasItems: !empty,
      orders: rows.map((r) => Object.assign({}, r, { cls: 'badge' + (tone[r.status] || '') }))
    };
  }
}
</script>
</body>
</html>
